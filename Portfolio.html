<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);


       const ambientLight = new THREE.AmbientLight(0xF0F8FF, .5);
        scene.add(ambientLight);

        const topSpotLight = new THREE.SpotLight(0xffffff, 2.5, 40, Math.PI / 4, 0.4, 1.5);
        topSpotLight.position.set(0, 8, 0);
        topSpotLight.target.position.set(0, 0, 0);
        topSpotLight.castShadow = true;
        scene.add(topSpotLight);
        scene.add(topSpotLight.target);

        scene.background = new THREE.Color(0xFFFFFF);

        scene.fog = new THREE.Fog(0xF0F8FF, 1, 30);

      //          pmremGenerator.dispose();

        let scene1;
        const loader = new THREE.GLTFLoader();
        loader.load('https://inwtio.github.io/teerapat.graphics/Scene1.glb', (gltf) => {
            scene1 = gltf.scene;
            scene1.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            scene1.position.set(0, 1.7, 0);
            //scene1.scale.set(2, 2, 2);
            scene.add(scene1);
        });


        function animate(t) {
            //if (bear) {
           //     bear.rotation.y = Math.sin(t * 0.001);
            //} 
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {

        });
