        function attachAnimations(model, gltf) {
            if (!gltf || !gltf.animations || gltf.animations.length === 0) {
                return null;
            }

            const mixer = new THREE.AnimationMixer(model);
            gltf.animations.forEach((clip) => {
                mixer.clipAction(clip).play();
            });
            animationMixers.push(mixer);
            return mixer;
        }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let picked_object = null;

    const customTargetMap = {
        'Cube002': 'Interactive',
        'Cube002_1': 'Interactive',

        'Cube_1': 'PBRshowcase',
        'Cube': 'PBRshowcase',

        'Profile002': 'Paint',

        'Cube003_1': 'Info'
    };

    function normalizeName(name) {
        return String(name || '').toLowerCase().replace(/[.\s_]/g, '');
    }

    function findObjectByName(root, name) {
        let match = null;
        root.traverse((object) => {
            if (!match && normalizeName(object.name) === normalizeName(name)) {
                match = object;
            }
        });
        return match;
    }

    renderer.domElement.addEventListener('click', onPick);
    function onPick(e) {
        const r = renderer.domElement.getBoundingClientRect();
        const clientX = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : null);
        const clientY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : null);

        if (clientX === null || clientY === null) {
            return;
        }

        const x = clientX - r.left;
        const y = clientY - r.top;
        pointer.x = (x / r.width) * 2 - 1;
        pointer.y = -(y / r.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(pickables, true)[0];

        if (!hit) {
            picked_object = null;
            return;
        }

        const hitMesh = hit.object;
        console.log('Clicked Mesh Name:', hitMesh.name);

        let current = hitMesh;
        while (current && current !== scene) {
            const targetName = customTargetMap[current.name];
            if (targetName) {
                const target = findObjectByName(scene, targetName);
                if (target) {
                    picked_object = target;
                    console.log('Matched sign click -> target:', picked_object.name);
                    return;
                }
            }
            current = current.parent;
        }

        picked_object = hitMesh;
        console.log('Picked GLB object:', picked_object.name || '(unnamed mesh)');
    }

    function addPickableObject(name, geometry, position) {
        const mesh = new THREE.Mesh(geometry, defaultPickMaterial);
        scene.add(mesh);
        mesh.name = name;
        mesh.position.copy(position);
        pickables.push(mesh);
        
        const outlineMesh = new THREE.Mesh(geometry, defaultOutlineMaterial);
        scene.add(outlineMesh);
        outlineMesh.position.copy(position);
        mesh.add(outlineMesh);

        return mesh;
    }

    function lerp(a, b, t) {
        //return a * (1 - t) + b * t;
        return (1.0 - t) * a + t * b;
    }

        function animate(t) {
