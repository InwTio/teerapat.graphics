 const uniforms = {
    uTime: { value: 0.0 },
    uWaveAmplitude: { value: 0.0 },
    uLightDir: { value: new THREE.Vector3(0.5, 0.5, 1.0).normalize() },
    uBaseColor: { value: new THREE.Vector3(0.05, 1.0, 0.1) },
    uTopColor: { value: new THREE.Vector3(0.05, 1.0, 0.1) },
    uBottomColor: { value: new THREE.Vector3(0.45, 0.22, 0.08) },
    uColorSplit: { value: 0.95 },
    uUseHeightColors: { value: 0.0 },
    uTexture: { value: new THREE.TextureLoader().load('https://threejs.org/examples/textures/uv_grid_opengl.jpg') },
    //uTexture: { value: new THREE.TextureLoader().load('https://inwtio.github.io/teerapat.graphics/tu.jpg') }
  };

  const vertexShader = `
    uniform float uTime;
    uniform float uWaveAmplitude;
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPosW;

    void main() {
      vUv = uv;
      vNormal = normal;
      vPosW = position;

      vec3 pos = position;
      pos.z += sin(pos.x * 5.0 + uTime * 2.0) * uWaveAmplitude;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `;

  const fragmentShader = `

    precision mediump float;
    uniform sampler2D uTexture;
    uniform vec3 uLightDir;
    uniform vec3 uBaseColor;
    uniform vec3 uTopColor;
    uniform vec3 uBottomColor;
    uniform float uColorSplit;
    uniform float uUseHeightColors;
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPosW;

    void main() {
      // เริ่มเขียน fragment shader ที่นี่
      //vec3 color = vec3(vUv, 0.5);
     // vec3 color = vec3(1.0, 0.3, 0.0);
    //vec3 basecolor = texture2D(uTexture, vUv).xyz;
     vec3 N = normalize(vNormal);
     vec3 L = normalize(uLightDir);

    // Lambert diffuse
    float diffuse = max(dot(N,L), 0.0);
    float level = 5.0;
    diffuse = floor(diffuse * level) / level;

    // Ambient light
    float ambient = 0.3;
      
     // Phong specular
     vec3 R = reflect(-L, N);
     vec3 V = normalize(cameraPosition - vPosW);
     float specular = pow(max(dot(R, V), 0.0), 4.0) * 0.9;
     specular = floor(specular * 4.0) / 4.0;
     //specular = step(0.7, specular);
     specular = smoothstep(0.1, 0.4, specular);


    float topMask = smoothstep(uColorSplit - 0.05, uColorSplit + 0.05, vPosW.y);
    vec3 heightColor = mix(uBottomColor, uTopColor, topMask);
    vec3 baseColor = mix(uBaseColor, heightColor, uUseHeightColors);
    vec3 color = baseColor * (diffuse + ambient) + vec3(specular);



      gl_FragColor = vec4(color, 1.0);
    }
  `;
         const material = new THREE.ShaderMaterial({
            vertexShader,

        function attachAnimations(model, gltf) {
            if (!gltf) {
                return null;
            }

            console.log('Loaded GLTF with animation clips:', gltf.animations ? gltf.animations.length : 0, 'for model:', model.name || 'unnamed');

            if (!gltf.animations || gltf.animations.length === 0) {
                model.userData.fallbackRotateSpeed = 0.01;
                fallbackAnimatedModels.push(model);
                return null;
            }

            const mixer = new THREE.AnimationMixer(model);
            gltf.animations.forEach((clip) => {
                const action = mixer.clipAction(clip);
                action.setLoop(THREE.LoopRepeat);
                action.play();
            });
            animationMixers.push(mixer);
            return mixer;
        }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let picked_object = null;

    const customTargetMap = {
        'Cube002': 'Interactive',
        'Cube002_1': 'Interactive',

        'Cube_1': 'PBRshowcase',
        'Cube': 'PBRshowcase',

        'Profile002': 'Paint',
        'Profile002_1': 'Paint',

        'Cube003': 'Info',
        'Cube003_1': 'Info'
    };

    function normalizeName(name) {
        return String(name || '').toLowerCase().replace(/[.\s_]/g, '');
    }

    function findObjectByName(root, name) {
        let match = null;
        root.traverse((object) => {
            if (!match && normalizeName(object.name) === normalizeName(name)) {
                match = object;
            }
        });
        return match;
    }

    renderer.domElement.addEventListener('click', onPick);
    function onPick(e) {
        const r = renderer.domElement.getBoundingClientRect();
        const clientX = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : null);
        const clientY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : null);

        if (clientX === null || clientY === null) {
            return;
        }

        const x = clientX - r.left;
        const y = clientY - r.top;
        pointer.x = (x / r.width) * 2 - 1;
        pointer.y = -(y / r.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(pickables, true)[0];

        if (!hit) {
            picked_object = null;
            return;
        }

        const hitMesh = hit.object;
        console.log('Clicked Mesh Name:', hitMesh.name);

        if (hitMesh.name === 'Screenshot_2026-10-04_125950') {
            picked_object = hitMesh;
            window.open('https://inwtio.github.io/teerapat.graphics/700_Transformation.html', '_blank');
            return;
        }
        if (hitMesh.name === 'Screenshot_2026-10-04_133951') {
            picked_object = hitMesh;
            window.open('https://inwtio.github.io/teerapat.graphics/PBRshowcase.html', '_blank');
            return;
        }
        if (hitMesh.name === 'Screenshot_2026-10-04_133802') {
            picked_object = hitMesh;
            window.open('https://inwtio.github.io/teerapat.graphics/paint.html', '_blank');
            return;
        }
         if (hitMesh.name === 'what') {
            picked_object = hitMesh;
            window.open('https://inwtio.github.io/teerapat.graphics/jumpscare.html', '_blank');
            return;
        }

        let current = hitMesh;
        while (current && current !== scene) {
            const targetName = customTargetMap[current.name];
            if (targetName) {
                const target = findObjectByName(scene, targetName);
                if (target) {
                    picked_object = target;
                    console.log('Matched sign click -> target:', picked_object.name);

                    return;
                }
            }
            current = current.parent;
        }

        picked_object = hitMesh;
        console.log('Picked GLB object:', picked_object.name || '(unnamed mesh)');
    }

    function addPickableObject(name, geometry, position) {
        const mesh = new THREE.Mesh(geometry, defaultPickMaterial);
        scene.add(mesh);
        mesh.name = name;
        mesh.position.copy(position);
        pickables.push(mesh);
        
        const outlineMesh = new THREE.Mesh(geometry, defaultOutlineMaterial);
        scene.add(outlineMesh);
        outlineMesh.position.copy(position);
        mesh.add(outlineMesh);

        return mesh;
    }

    function lerp(a, b, t) {
        //return a * (1 - t) + b * t;
        return (1.0 - t) * a + t * b;
    }

    addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

        function animate(t) {
            const delta = clock.getDelta();
            uniforms.uTime.value += delta;
            animationMixers.forEach((mixer) => mixer.update(delta));

           

            if (picked_object != null) {
                controls.target.lerp(picked_object.position, 0.1);
            }

            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {

        });
