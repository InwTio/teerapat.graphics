<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jumpscare</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #jumpscare {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      color: white;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <img id="jumpscare" src="https://inwtio.github.io/teerapat.graphics/ghost.jpeg" alt="Jumpscare" />

  <audio id="jumpscareAudio" preload="auto" loop>
    <source src="https://raw.githubusercontent.com/pooh-holo47/pooh.ooo/main/jumpscare.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const jumpscare = document.getElementById('jumpscare');
    const audio = document.getElementById('jumpscareAudio');

    function triggerJumpscare() {
      jumpscare.style.display = 'block';
      audio.play().catch(() => {});
    }

    window.addEventListener('load', triggerJumpscare);
  </script>
</body>
</html>
